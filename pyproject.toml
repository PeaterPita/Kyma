[project]
name = "Kyma"
version = "0.1.0"
dependencies = [
  "Pygments>=2.19.2",
  "markdown-it-py>=4.0.0",
  "mdurl>=0.1.2",
  "numpy>=2.3.4",
  "opensimplex>=0.4.5.1",
  "rich==14.2.0",
]

[project.scripts]
kyma = "kyma.main:main"

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "I", "B", "SIM", "UP", "F", "D", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
